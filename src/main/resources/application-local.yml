spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fuel_station_reconciliation}
    username: ${DB_USERNAME:fuel_station_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: FuelStationHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

logging:
  level:
    com.bpcl.reconciliation: DEBUG

app:
  storage:
    receipt-root: ./data/local/receipts
    invoice-root: ./data/local/invoices